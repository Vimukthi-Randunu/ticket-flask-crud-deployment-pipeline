name: CI/CD Pipeline

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run database migrations
        env:
          FLASK_APP: crudapp.py
        run: |
          # remove entirely. Only ever run once, by a human, when a project has no migration history yet. It's already done and committed.
          # flask db init 
          #remove too, for the same reason. This generates a new migration file by comparing models against current schema — we don't want a new one generated on every CI run; we already have the one migration file (73ffc2948065_entries_table.py) that fully describes the schema.
          # flask db migrate -m "entries table"
          flask db upgrade

      - name: Run tests
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ticket-flask-crud-deployment-pipeline:${{ github.sha }}
